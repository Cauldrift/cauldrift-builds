name: Idea
description: Suggest a new feature or an improvement for Cauldrift. English or German is fine.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Please check the [existing issues](https://github.com/Cauldrift/cauldrift-builds/issues) first: if your idea is already there, add a 👍 reaction instead of a new issue. One idea per issue.
        *Deutsch ist auch in Ordnung.*
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Flying and combat
        - Trading and economy
        - Ships and fleets
        - Stations and building
        - Factions, law and missions
        - Server and administration
        - Controls and user interface
        - Graphics and sound
        - Other
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it make the game better?
      description: Which problem does it solve, or what would be more fun?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details, examples or sketches (optional)
      description: Screenshots, sketches or examples from other games are welcome.
