name: Bug report
description: Report a problem in Cauldrift (game client or server). Please write in English.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping to improve Cauldrift! Please check the [existing issues](https://github.com/Cauldrift/cauldrift-builds/issues) first and report one problem per issue.
        Ideas have their own form. Questions are best asked on Discord (see the links on the previous page).
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the main menu and in the pause menu.
      placeholder: alpha-0.1.00
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where does it happen?
      options:
        - Game (client)
        - Server
        - Both / not sure
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: start_file
    attributes:
      label: How did you start it?
      options:
        - Cauldrift-High
        - Cauldrift-Low
        - Server start file
        - Not sure
  - type: input
    id: gpu
    attributes:
      label: Graphics card (game only)
      placeholder: e.g. NVIDIA RTX 3060, AMD RX 6700, Intel UHD 620
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Dock at ...
        2. Open ...
        3. ...
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Only once
  - type: textarea
    id: logs
    attributes:
      label: Log files and screenshots
      description: |
        Drag screenshots or log files into this box. Before uploading, remove anything you don't want to be public.
        - Game log: Windows `%APPDATA%\Godot\app_userdata\Cauldrift\logs\godot.log`, Linux `~/.local/share/godot/app_userdata/Cauldrift/logs/godot.log`
        - Server log: `logs/server.log` in the server folder
